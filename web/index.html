<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7e7e5" id="themeColor">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chords">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // theme and hand before the first paint, so nothing flashes
    try {
      if (localStorage.getItem('gsa:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      if (localStorage.getItem('gsa:hand') === 'left') document.documentElement.classList.add('lefty-pending');
    } catch (e) {}
  </script>
  <title>Chords</title>
</head>
<body class="v">

  <!-- sign in -->
  <section id="v-login" class="view login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <h1>Chords</h1>
      <p id="loginText"></p>
      <input id="pw" type="password" class="name-input" placeholder="Password" autocomplete="current-password" required>
      <input id="pw2" type="password" class="name-input" placeholder="Repeat the password" autocomplete="new-password" hidden>
      <button type="submit" class="primary" id="loginBtn">Sign in</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>

  <!-- songs -->
  <section id="v-songs" class="view page" hidden>
    <header class="page-top">
      <h1 class="page-title">Songs</h1>
      <div class="page-tools">
        <button id="themeToggle" type="button" class="pill" title="Light or dark"></button>
        <button id="handToggle" type="button" class="pill" title="Right- or left-handed fretboard"></button>
      </div>
    </header>
    <ul id="songList" class="song-list"></ul>
    <p id="songsEmpty" class="empty-note" hidden>No songs yet. Tap + to start one.</p>
    <button id="openScratch" type="button" class="fab-left" title="The analyzer, without a song"></button>
    <button id="newSong" type="button" class="fab" aria-label="New song" title="New song"></button>
  </section>

  <!-- one song (or the Unsorted folder) -->
  <section id="v-song" class="view page" hidden>
    <header class="song-head">
      <div class="song-head-row">
        <button id="songBack" type="button" class="ghost-btn back" aria-label="Songs"></button>
        <h1 id="songTitle" class="song-title" title="Rename"></h1>
      </div>
      <p id="songMeta" class="page-meta"></p>
      <button id="songTuning" type="button" class="tuning-chip" title="Tuning for the whole song">
        <span class="tn"></span><span class="tname"></span>
      </button>
    </header>
    <div id="chordGrid" class="chord-grid"></div>
    <p id="chordsEmpty" class="empty-note" hidden></p>
    <div class="grid-foot">
      <button id="addSection" type="button" class="add-section">+ Section</button>
      <span class="grid-hint">Hold a card to move or delete it, or drag it to a new place.</span>
    </div>
    <button id="addChord" type="button" class="fab" aria-label="Add a chord" title="Add a chord"></button>
  </section>

  <!-- analyzer -->
  <section id="v-analyzer" class="view analyzer" hidden>
    <header class="a-top">
      <div class="a-bar">
        <button id="aBack" type="button" class="ghost-btn back" aria-label="Back"></button>
        <span id="aContext" class="a-context"></span>
        <button id="tuningBtn" class="tuning-btn" type="button" title="Tuning (T)">
          <span id="tuningNotes" class="tn"></span>
          <span id="tuningName" class="tname"></span>
        </button>
      </div>
    </header>

    <main class="stage">
      <div id="board" class="board"></div>
      <aside class="side">
        <ol id="cands" class="cands" aria-label="Chord names"></ol>
        <nav class="bar">
          <div class="seg" role="group" aria-label="Show on the fretboard" title="Notes or intervals (I)">
            <button type="button" data-display="notes">Notes</button>
            <button type="button" data-display="intervals">Intervals</button>
          </div>
          <div class="moves">
            <button id="lower" type="button" class="move lower" title="One fret lower (← ↑)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span>Lower</span>
            </button>
            <button id="higher" type="button" class="move higher" title="One fret higher (→ ↓)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span>Higher</span>
            </button>
          </div>
          <button id="allNotes" type="button" class="clear all-toggle" aria-pressed="false" title="Show every note of the tuning on the board (A)">All notes</button>
          <button id="clear" type="button" class="clear" title="Clear (Backspace)">Clear</button>
        </nav>
      </aside>
    </main>


    <nav id="scratchbar" class="scratchbar" hidden>
      <span></span>
      <button id="saveScratch" type="button" class="save" disabled title="Save this chord to Unsorted (⌘S / Ctrl+S)">Save</button>
      <button id="saveToSong" type="button" class="to-song" disabled title="Add this chord to the end of a song">To a song…</button>
    </nav>

    <nav id="songbar" class="songbar" hidden>
      <button id="prevChord" type="button" class="nav prev" title="Previous chord ([) · hold to add a chord before this one">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span id="chordPos" class="pos"></span>
      <button id="saveChord" type="button" class="save" disabled title="Save to this chord (⌘S / Ctrl+S)">Save</button>
      <button id="deleteChord" type="button" class="icon-only" aria-label="Delete this chord" title="Delete this chord"></button>
      <button id="nextChord" type="button" class="nav next" title="Next chord (]) · hold to add a chord after this one">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
  </section>

  <div id="sheet" class="sheet-wrap" aria-hidden="true">
    <div class="scrim"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header>
        <button id="sheetBack" type="button" class="ghost-btn back" hidden aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h2 id="sheetTitle">Tunings</h2>
        <button id="sheetClose" type="button" class="ghost-btn" aria-label="Close">Done</button>
      </header>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>

  <div id="dialog" class="dialog-wrap" aria-hidden="true">
    <div class="scrim"></div>
    <div class="dialog" role="alertdialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
